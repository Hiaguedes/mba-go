<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Cursos</h1>
    <table>
      <tr>
        <th>Nome</th>
        <th>Horas</th>
      </tr>
      <tbody>
        {{ range .}}
        <tr>
          <td>{{ .Nome | ToUpper }}</td>
          <td>{{ .CargaHoraria }}</td>
          <td>{{ .Descricao }}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </body>
</html>
